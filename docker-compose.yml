# Settings shared by every service. Live market data needs MARKETDATA_TOKEN (or TRADIER_API_KEY
# with OPTIONS_SCOUT_MARKET_PROVIDER=tradier); without one the API still starts and serves requests
# that bring their own key (W42).
x-common-env: &common-env
  OPTIONS_SCOUT_DATA_MODE: ${OPTIONS_SCOUT_DATA_MODE:-fixture}   # fixture by default; set live to use real sources
  OPTIONS_SCOUT_LLM_MODE: ${OPTIONS_SCOUT_LLM_MODE:-fixture}
  OPTIONS_SCOUT_MARKET_PROVIDER: ${OPTIONS_SCOUT_MARKET_PROVIDER:-}
  MARKETDATA_TOKEN: ${MARKETDATA_TOKEN:-}
  TRADIER_API_KEY: ${TRADIER_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # live-mode fallbacks when the market-data plan lacks them: VIX (FRED VIXCLS) and earnings dates
  # (Alpha Vantage); the scheduler's bottleneck job uses FRED too, the News Desk Alpha Vantage
  FRED_API_KEY: ${FRED_API_KEY:-}
  ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}

# What the services share on scout-data (W39): the market cache and the trend, bottleneck and
# IV snapshot databases. The scheduler refreshes the snapshots that the API and UI read; every
# store locks its own connection and waits up to 30 s on SQLite's file lock for another
# service's write. Each front end has its own checkpoint file (checkpoints.sqlite for the UI,
# checkpoints-api.sqlite for the API), and the knowledge index lives in the image, not here.
services:
  api:
    build: .
    command: ["python", "-m", "uvicorn", "options_scout.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    restart: unless-stopped
    environment:
      <<: *common-env
      # required: the API refuses to start without it (clients send it as X-API-Key)
      OPTIONS_SCOUT_API_KEY: ${OPTIONS_SCOUT_API_KEY:-}
      OPTIONS_SCOUT_RATE_LIMIT_PER_MIN: ${OPTIONS_SCOUT_RATE_LIMIT_PER_MIN:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    volumes: ["scout-data:/app/data"]
    healthcheck:
      # 503 when the knowledge base is empty (W42), so an image without it reports unhealthy
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    # the Streamlit UI has no authentication: published on this machine only (W37)
    ports: ["127.0.0.1:8501:8501"]
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes: ["scout-data:/app/data"]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    # Daily jobs: ATM IV snapshot per watchlist ticker, trend-board refresh and the bottleneck
    # board refresh with its thesis monitor (Phase 11). A failed job is logged with its exit code
    # and the heartbeat is not touched, so the healthcheck turns unhealthy (W42).
    build: .
    restart: unless-stopped
    # one pass at start, then every day at OPTIONS_SCOUT_SCHEDULE_AT New York time (default
    # 07:00, after the previous session); a failed job is logged as "scheduler: <job> failed"
    command: ["python", "-m", "options_scout.jobs.scheduler"]
    environment:
      <<: *common-env
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-options-scout-ai/0.1 (educational screener)}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      OPTIONS_SCOUT_SOCIAL_SOURCES: ${OPTIONS_SCOUT_SOCIAL_SOURCES:-}
      OPTIONS_SCOUT_BOTTLENECK_SOURCES: ${OPTIONS_SCOUT_BOTTLENECK_SOURCES:-}
      OPTIONS_SCOUT_CONTACT_EMAIL: ${OPTIONS_SCOUT_CONTACT_EMAIL:-}
      OPTIONS_SCOUT_SCHEDULE_AT: ${OPTIONS_SCOUT_SCHEDULE_AT:-07:00}
    volumes: ["scout-data:/app/data"]
    healthcheck:
      # healthy while every job of the last daily pass succeeded (heartbeat younger than 25 hours)
      test: ["CMD", "python", "-c", "import os, sys, time; p = '/app/data/scheduler.heartbeat'; sys.exit(not os.path.exists(p) or time.time() - os.path.getmtime(p) > 90000)"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 15m

volumes:
  scout-data:
