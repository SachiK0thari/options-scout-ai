# Global settings. Env vars prefixed OPTIONS_SCOUT_ override top-level keys (e.g. OPTIONS_SCOUT_DATA_MODE).
data_mode: fixture          # fixture | live
llm_mode: fixture           # fixture | live | anthropic | openrouter | none

paths:
  fixtures_dir: tests/fixtures
  cache_db: data/cache.sqlite
  checkpoint_db: data/checkpoints.sqlite   # OPTIONS_SCOUT_CHECKPOINT_DB overrides (tests use a temp file)
  iv_snapshot_db: data/iv_snapshots.sqlite
  prompts_dir: prompts
  brand_map: data/brand_map.yaml
  llm_cache_dir: tests/fixtures/llm

cache_ttl_seconds:
  option_chain: 900         # 15 min
  spot: 900
  earnings: 86400           # 24 h
  dividends: 86400
  history: 3600
  social_posts: 3600
  pageviews: 21600
  news: 3600
  sec_tickers: 604800       # 7 days

llm:
  provider: openrouter        # live provider: anthropic | openrouter (OPTIONS_SCOUT_LLM_MODE=live)
  extraction_batch_size: 20
  max_output_tokens: 8192     # reasoning tokens count against this too (OpenRouter)
  providers:
    openrouter:
      base_url: https://openrouter.ai/api/v1
      # One cheap, fast model for every task; OpenAI-compatible JSON-schema structured outputs.
      extraction_model: deepseek/deepseek-v4.1-flash
      explanation_model: deepseek/deepseek-v4.1-flash
      judge_model: deepseek/deepseek-v4.1-flash
      # DeepSeek v4.1 Flash reasons by default and its reasoning shares max_tokens with the reply:
      # unset (and at "low", measured 2026-11-10) a report narrative could run out of tokens with
      # 0 characters written (finish_reason=length). "none" turns reasoning off.
      reasoning_effort: none
      # $ per 1M tokens, fallback for cost accounting when OpenRouter omits usage.cost: OpenRouter's
      # list prices on 2026-11-12 (the billed cost can be lower when it routes to a cheaper host)
      pricing:
        deepseek/deepseek-v4.1-flash: {input: 0.30, output: 1.20}
        anthropic/claude-haiku-5.5: {input: 0.10, output: 0.50}
    anthropic:
      extraction_model: claude-haiku-5-5      # small/cheap: entity extraction, profile parsing
      explanation_model: claude-opus-5-5      # stronger: narrative
      judge_model: claude-sonnet-5-5          # optional LLM-as-judge
      pricing:
        claude-haiku-5-5: {input: 0.10, output: 0.50}
        claude-sonnet-5-5: {input: 2.00, output: 10.00}
        claude-opus-5-5: {input: 4.00, output: 20.00}

market_data:
  provider: marketdata        # live provider: marketdata (MarketData.app token) | tradier (API key)
  # VIX when the provider has no index data (MarketData.app answered empty on the 2026-11-11 run):
  # FRED's VIXCLS (Cboe, "Copyrighted: Citation Required"), with FRED_API_KEY; cited in the report
  vix_fallback: fred          # fred | none (neutral VIX 20)
  # Next earnings date when the provider has none (MarketData.app's /stocks/earnings answered 402
  # on the 2026-11-11 run). alphavantage: the confirmed date from EARNINGS_CALENDAR, else an
  # estimate, last report + 91 days, which the screens test as estimate - 21 days, so a put is
  # clear only if the estimate is 21+ days after its expiry; labelled "estimated". A last report
  # over 120 days old gives no estimate: unknown, puts excluded (W5). Free key, personal use.
  earnings_fallback: alphavantage   # alphavantage | none
  earnings_api_key_env: ALPHAVANTAGE_API_KEY
  earnings_cadence_days: 91
  earnings_margin_days: 21
  earnings_stale_after_days: 120
  marketdata:
    api_key_env: MARKETDATA_TOKEN  # the UI/API can also pass a token per run (never persisted)
    # W27. historical: the previous session's whole chain (every expiry and strike) by date, one
    # request per ticker, about 1 credit per 1,000 contracts (SBUX's 1,074 cost 2 credits on
    # 2026-11-10; without the date the same chain cost 383, SPY's 12,904 cost 6,206).
    # live: the current chain per expiry, billed per contract.
    chain_feed: historical
    strike_limit: 60          # live feed only: the 60 strikes nearest the money (0 = all)
    # Budget before spending: a ticker is assumed to need this many credits (SPY's chain about
    # 13, plus a quote, two candle series and the earnings lookup); a run is cut to what the
    # credits left today cover, with a note
    credits_per_ticker: 25
  tradier:
    sandbox: true             # sandbox.tradier.com: free developer token, 15-minute delayed data
    api_key_env: TRADIER_API_KEY   # the UI/API can also pass a key per run (never persisted)

ranking:
  # final = option_quality·w1 + stock_quality·w2 + max(social, 50)/100·w3
  #         + max(bottleneck, 50)/100·w4.
  # "Good to own" first, then the option's own economics, then the Market Intelligence signals
  # as tiebreakers. A signal can only help: a score below the neutral 50 counts as 50 (W29).
  # The bottleneck weight is 0: a curated large cap's company score tops out around 15 to 50
  # (materiality is low or medium), so the board is informational for this universe (PRD
  # 4A.11). Its former 0.05 went to option quality rather than to the social signal. The loader
  # rejects a file where social + bottleneck exceeds 0.15 or the four weights do not sum to 1.0.
  weights:
    option_quality: 0.55
    stock_quality: 0.35
    social: 0.10
    bottleneck: 0.0
  option_quality_weights:
    annualized_return: 0.35
    prob_otm: 0.30
    liquidity: 0.20
    iv_rank_fit: 0.15
  # Best N contracts per ticker and strategy survive the ranker (0 = no cap). Keeps one dense
  # ETF chain from occupying every slot at the top of the list.
  max_per_ticker: 2

trends:
  snapshot_max_age_hours: 24
  top_n_investable: 8
  evidence_posts_per_entity: 4
  retention_hours: 48      # stored social snapshots (incl. post excerpts) older than this are deleted

agent:
  max_sizing_retries: 3
  max_explainer_retries: 2
  verifier_number_tolerance: 0.01       # relative tolerance when matching narrative numbers
  checkpoint_retention_days: 7          # threads idle longer than this are deleted when the checkpoint DB opens (0 = keep)
  api_max_workers: 4                    # API runs (screens, chat turns) executing at once
  api_max_queued: 8                     # more runs may wait; beyond that the API answers 429

risk:
  stress_shocks: [-0.10, -0.20, -0.30]
  stress_iv_shock: 0.50                 # IV +50% on down moves, in full at the tenor below
  stress_iv_shock_ref_dte: 30           # shock shrinks as sqrt(30 / DTE) for longer-dated legs

disclaimer: >-
  Educational screening tool. Not investment, tax or legal advice. Options involve
  significant risk, including loss exceeding the premium received on margin. Data may be
  delayed or inaccurate.
