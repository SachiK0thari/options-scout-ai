# Bottleneck Arbitrage data sources (PRD section 4A.5). Every adapter has a `live` and a `fixture`
# mode and reports a SourceStatus; flip `enabled` to switch sources. Switching sources is
# configuration: bottleneck/sources.py (step 11.2) is the only place that maps a name to a class.
#
# Quick override without editing this file (comma-separated, any of
# edgar|fred|csv_series|transcripts|news|reddit|google_trends):
#   OPTIONS_SCOUT_BOTTLENECK_SOURCES=edgar,fred,news
#
# At least one TEXT source (edgar, transcripts, news, reddit) must stay enabled: tightening and
# easing mentions are the signal; series sources only confirm it.
#
# Fixture mode (the default) needs no credentials. Fixture files live under tests/fixtures/bottleneck/.

edgar:                          # text: 10-K / 10-Q MD&A and risk factors, 8-K earnings releases
  enabled: true
  weight: 1.0
  fixture_file: edgar_snippets.jsonl
  base_url: https://efts.sec.gov/LATEST/search-index
  forms: ["10-K", "10-Q", "8-K"]
  lookback_days: 120
  max_requests_per_second: 8    # SEC guidance is 10 req/s; stay under it
  cache_ttl_hours: 24
  contact_email_env: OPTIONS_SCOUT_CONTACT_EMAIL   # descriptive User-Agent with a contact address
  timeout_seconds: 30
  max_documents_per_query: 10   # filings opened per layer keyword; each is windowed into snippets
  max_snippets_per_document: 4
  max_document_chars: 2000000   # a 10-K is a few MB of HTML; the rest of the file is ignored
  max_attempts: 3               # 5xx and 429 are retried with backoff; other 4xx are final

fred:                           # series: producer-price and industrial series per layer
  enabled: true
  weight: 1.0
  fixture_file: fred_series.json
  api_key_env: FRED_API_KEY     # free key; series ids are configuration in config/themes.yaml
  base_url: https://api.stlouisfed.org/fred/series/observations
  lookback_days: 400
  timeout_seconds: 30
  cache_ttl_hours: 24
  max_attempts: 3

csv_series:                     # series: operator-licensed trackers dropped as dated CSVs (never committed)
  enabled: true
  weight: 1.0
  directory: data/bottleneck_series

transcripts:                    # text: earnings-call transcripts are paid elsewhere; FIXTURE MODE ONLY
  enabled: false
  weight: 1.0
  fixture_file: transcripts.jsonl

news:                           # text: trade and financial headlines (supply-response items, deals, coverage count)
  enabled: true
  weight: 1.0
  fixture_file: news.jsonl
  max_items_per_layer: 50

reddit:                         # text: industry subreddits for everyday observation (prices paid, availability)
  enabled: true
  weight: 0.5
  fixture_file: reddit_posts.jsonl

google_trends:                  # series: search interest in layer keywords, cross-source confirmation only
  enabled: true
  weight: 1.0
  fixture_file: google_trends.json
