# Compliance agent (PRD.md section 13.1). Everything this app produces is education and a screen,
# never advice; these are the deterministic rules the agent applies to every LLM-written text.

max_age_days: 400            # a cited rule/filing older than this gets a "(source may be out of date)" warning
max_snapshot_age_days: 7     # a cited bottleneck board whose snapshot `as_of` is older than this gets a "(bottleneck snapshot may be out of date)" warning (Phase 11)
reminder: "Education, not advice."   # one-line closer required on chat replies that name a specific option
require_delayed_data_statement: true # report narratives must say the data is delayed

# Regexes (case-insensitive) that block a paragraph in any mode. `label` groups them for the audit log.
banned_patterns:
  # certainty
  - {label: certainty, pattern: "\\bguarantee[ds]?\\b"}
  # "the risk-free rate" (the T-bill yield the payload supplies) is terminology, not a claim
  - {label: certainty, pattern: "\\brisk[- ]?free\\b(?!(?:\\s+interest)?\\s+rates?\\b)"}
  - {label: certainty, pattern: "\\bcan(?:'|no)?t lose\\b"}
  - {label: certainty, pattern: "\\bsure thing\\b"}
  - {label: certainty, pattern: "\\bwill (?:profit|make money|pay off|go up|rise|rally|recover)\\b"}
  - {label: certainty, pattern: "\\bfree money\\b"}
  - {label: certainty, pattern: "\\bsafe (?:trade|bet|income|play|way to)\\b"}
  # directives addressed to the reader
  - {label: directive, pattern: "\\byou should\\b"}
  - {label: directive, pattern: "\\byou need to\\b"}
  - {label: directive, pattern: "\\byou(?:'d| would) (?:want|do well|be wise) to\\b"}
  - {label: directive, pattern: "\\b(?:i|we)(?:'d| would)? recommend\\b"}
  - {label: directive, pattern: "\\bi'?d go with\\b"}
  # imperative with an object; "to roll the short call" (infinitive, descriptive) is exempt
  - {label: directive, pattern: "(?<!to )\\b(?:buy|sell|open|enter|roll|take|grab|load up on|pick up) (?:the|this|that|these|those|a|an|some|your) (?:[^\\s.;:!?*]+ ){0,3}?(?:puts?|calls?|positions?|trades?|spreads?|contracts?|leaps|pmcc)\\b"}
  - {label: directive, pattern: "\\bstrong buy\\b"}
  - {label: directive, pattern: "\\bmust buy\\b"}
  - {label: directive, pattern: "\\b(?:buy|get in|act) now\\b"}
  # superlatives of quality
  - {label: superlative, pattern: "\\bbest (?:trade|setup|play|bet|opportunity|pick)\\b"}
  - {label: superlative, pattern: "\\bgreat (?:trade|setup|play|opportunity|pick|entry)\\b"}
  - {label: superlative, pattern: "\\bno[- ]brainer\\b"}
  - {label: superlative, pattern: "\\bslam dunk\\b"}
  - {label: superlative, pattern: "\\beasy money\\b"}
  # urgency
  - {label: urgency, pattern: "\\bdon'?t miss\\b"}
  - {label: urgency, pattern: "\\bbefore it'?s too late\\b"}
  - {label: urgency, pattern: "\\bhurry\\b"}
  - {label: urgency, pattern: "\\bget in before\\b"}

# Inside an `education` paragraph that carries a citation, these spans are removed before the
# banned patterns are applied: quoted terminology and "X is the term for…" definitions.
# Reviewed against the thesis-monitor vocabulary of the bottleneck board (Phase 11, step 11.5):
# "holding", "tripped since <date>", "thesis weakening", "easing", "new supply" are reports of
# state, match no banned pattern and need no allow-list entry; the board never says exit, sell or
# take profits (tests/unit/test_compliance.py::test_thesis_monitor_vocabulary_is_not_advice).
allow_list:
  - "[\"“][^\"”]{1,80}[\"”]"
  - "\\b\\S+(?:[- ]\\S+){0,3} is the (?:term|name|phrase|order type|order) (?:for|used|brokers use)\\b[^.]*"
  - "\\brisk[- ]free rate\\b"

# Conservative defaults (13.1) applied with the Risk agent's suitability facts.
suitability:
  min_buying_power: {csp: 2500, leaps: 1000, pmcc: 2500}   # dollars needed before a strategy is described
  reject_naked_language_on_cash: true
  reject_leverage_opportunity_when_conservative: true

# Check 9 (Phase 12, Goal Planning narratives): the verdict is stated in words, the stress path is
# named whenever a projection is, a FIRE reply names its variant and sources its withdrawal rate
# from diversified-portfolio research, and no projected figure is promised ("would", never "will").
goal:
  require_status: true
  require_stress_path: true
  fire_requires_withdrawal_source: true
  promise_pattern: "\\bwill (?:reach|hit|have|grow|be worth|cover|get you|retire)\\b"

# Check 11 (Phase 12, Tax & Accounts replies): the tax disclaimer sentence appears exactly once,
# no reply states the rate a reader will pay, no filing instruction is given in the imperative;
# account-type claims live in cited education paragraphs (check 2 covers the citations).
tax:
  disclaimer: "This is education, not tax advice; rules change and individual situations differ, so confirm with a tax professional or the IRS publication cited."
  forbid_rates: true

# Check 1 (W14): number grounding. The report explainer writes figures as slots
# ({{positions[CSP-...].realistic_loss|money}}) that Python fills; any other figure in its
# screen_result and notice paragraphs is a violation unless it matches `literal_allow`. In every
# text, a figure next to one of these labels (the nearest in the same clause, after the label,
# else before it) must be that label's field, of the candidate the sentence names if it names
# one. `fields` are globs over payload paths; `*` matches anything. Order matters: the first label
# that covers a phrase owns it.
grounding:
  labels:
    - label: maximum loss
      pattern: "\\bmax(?:imum)?\\.?\\s+loss\\b"
      fields: ["*max_loss"]
    - label: realistic loss
      pattern: "\\b(?:realistic|modell?ed)\\s+loss\\b"
      fields: ["*realistic_loss", "*realistic_loss_per_contract"]
    - label: breakeven
      pattern: "\\bbreak[- ]?even\\b"
      fields: ["*breakeven", "*break_even*"]
    - label: premium
      pattern: "\\bpremiums?\\b"
      fields: ["*.premium", "*premium_income", "*.mid", "*max_gain", "*premium_per_contract"]
    - label: collateral
      pattern: "\\bcollateral\\b"
      fields: ["*capital_used", "*csp_dollars", "*short_put_notional", "*assignment_cash", "*collateral*"]
    - label: margin
      pattern: "\\bmargin\\b(?!\\s+accounts?\\b)"
      fields: ["*margin_used", "risk.checks[margin_usage].value", "*margin_requirement*"]
    - label: probability
      pattern: "\\b(?:probability|chance|likelihood|odds)\\b"
      fields: ["*prob*", "*.pop"]
      require_field: true
    - label: annualised return
      pattern: "\\bannuali[sz]ed\\s+(?:return|yield)\\b|\\bannual\\s+return\\b"
      fields: ["*annuali*", "*return_pct", "*yield*"]
      require_field: true
  literal_allow:
    - "\\b\\d{1,2}[–-]\\d{1,2} DTE\\b"   # the screening window as rule text ("30–45 DTE")
    # Method terms: the names of fixed measures, which the app's own warnings and reasons use.
    # Each number is a constant in code, pinned by tests/unit/test_grounding.py.
    - "\\b30[- ]day[\\s-]+(?:(?:realised|realized|historical)[\\s-]+)?(?:volatility|vol|measure|window|HV|figure|proxy)\\b"  # hist_vol(window=30)
    - "\\b90[- ]day\\s+(?:closing\\s+)?(?:high|drawdown|lookback|look-back|window)\\b"  # quality gate drawdown
    - "\\b30\\+?\\s+(?:stored\\s+)?IV\\s+snapshots\\b"   # snapshot_iv.MIN_HISTORY before IV rank uses history
    # Index names: a name, not a figure
    - "\\bS&P\\s?500\\b|\\bNasdaq[- ]100\\b|\\bRussell\\s2000\\b"
