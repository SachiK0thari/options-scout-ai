# "Good to own" universe (CLAUDE.md section 3.7).
#
# The screener only looks at stocks on this curated list (plus tickers the user adds), and every
# ticker — curated or not — must also pass the deterministic numeric gates below on the day of the
# run. Nothing here is a recommendation: the list is a *filter* that keeps volatile, speculative or
# distressed names out of a put-selling / LEAPS screen aimed at stocks the user would be happy to
# own if assigned.
#
# Order matters: when more tickers qualify than `universe.max_tickers`, the user's own tickers come
# first, then curated names with a consumer-trend signal, then this order.

universe:
  max_tickers: 12            # live mode: cap on tickers fetched per run (watchlist always included)

gates:
  require_curated: false     # true → user-added tickers outside this list are rejected outright
  min_price: 20.0            # dollars; avoids low-priced, easily manipulated names
  min_avg_volume: 1000000    # shares/day
  max_hv30: 0.35             # annualised 30-day realised volatility (0.35 = 35%)
  max_atm_iv: 0.45           # at-the-money implied volatility on the near-term chain
  max_drawdown_90d: 0.20     # distance below the 90-day closing high (0.20 = 20%)
  min_history_days: 31       # closes needed to evaluate HV / drawdown; fewer → gate fails

# Quality score 0–1 shown next to each stock and blended into the ranking (settings.yaml ranking.weights).
score:
  weights:
    stability: 0.40          # 1 − hv30 / max_hv30 (calmer price action scores higher)
    trend: 0.30              # 1 − drawdown_90d / max_drawdown_90d (closer to its highs scores higher)
    curated: 0.30            # 1 if the ticker is on the curated list, else 0

