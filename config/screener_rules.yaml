# Sections 3.3–3.5. Deltas are absolute values. Percentages are fractions.
csp:
  dte_min: 30
  dte_max: 45
  # Fallback used ONLY when the strict window has no liquid candidates (weeklies-only weeks):
  # the nearest expiry inside this wider window is allowed and flagged `dte_outside_preferred`.
  dte_fallback_min: 21
  dte_fallback_max: 60
  fallback_tie_days: 3    # fallback expiries this close to the nearest are a tie: more open interest, then longer, wins
  delta_min: 0.15
  delta_max: 0.30
  min_open_interest: 500
  max_spread_pct: 0.10
  min_bid: 0.10
  exclude_earnings_before_expiry: true
  # W5: a single stock whose earnings date is unknown (lookup failed, or none reported) is
  # excluded; false keeps it with the `earnings_unknown` flag. ETFs are unaffected.
  exclude_when_earnings_unknown: true
  min_underlying_price: 10.0
  min_avg_volume: 1000000
  preferred_iv_rank_min: 0.30         # soft score, not a hard filter

leaps:
  dte_min: 365
  dte_preferred: 540
  delta_min: 0.70
  delta_max: 0.85
  max_extrinsic_per_year_pct: 0.05
  min_open_interest: 100
  max_spread_pct: 0.05
  preferred_iv_rank_max: 0.40         # soft score
  roll_warning_dte: 240
  # Ranking (W3). Carry = (extrinsic + dividends forgone − interest saved on the cash not spent)
  # per year over the stock price: the yearly cost of the call against owning 100 shares.
  # max_extrinsic_per_year_pct above stays the hard filter.
  rank_by: carry                      # carry | extrinsic
  carry_score_cap: 0.05               # a carry at or above this scores 0 on the cost term
  intrinsic_tolerance: 0.05           # W25: $/share a mid may sit below intrinsic (S - K) before the quote counts as stale

pmcc:
  dte_min: 30
  dte_max: 45
  dte_fallback_min: 21
  dte_fallback_max: 60
  delta_min: 0.20
  delta_max: 0.30
  # safety rule (always on): short strike >= LEAPS strike + LEAPS net debit

# How each candidate's implied vol is chosen (W1). The Greeks, the probability OTM and the
# stress test all use this figure, so it must belong to the quoted price.
implied_vol:
  solve_from_mid: true          # false restores the provider's figure
  disagreement_points: 0.05     # |provider - solved| above this sets the flag iv_disagrees
