# Holdings analysis in the Portfolio agent (Phase 12, docs/capstone-plan.md section 12.6).

covered_call_lot: 100        # shares per lot a covered call needs
beta_lookback_days: 252      # one year of daily closes for beta vs SPY (MarketData.app already fetches the year; about ±0.3 at 95% for a typical stock, ±0.5 on 90 days)
beta_index: SPY
beta_interval: 0.95          # confidence level of each beta's range and of the portfolio exposure's
beta_min_returns: 60          # W25: daily returns on dates both series share; fewer and beta is reported unknown

# Annual expense ratios (percent) for ETFs a user may hold; stocks have none. Sources: fund
# prospectuses as of 2026; the Learn tab says "about" and cites investor.gov on fees.
expense_ratios_pct:
  SPY: 0.0945
  QQQ: 0.18          # cut from 0.20 when QQQ became an open-end fund, 2025-12-22 (Invesco)
  VOO: 0.03
  IVV: 0.03
  VTI: 0.03
  DIA: 0.16
  IWM: 0.19

# Sector for tickers outside config/quality_universe.yaml; anything else is reported as "Unknown".
sectors:
  VOO: ETF
  IVV: ETF
  VTI: ETF
  DIA: ETF
  IWM: ETF
