# Goal Planning agent (Phase 12, docs/capstone-plan.md section 12.2). Every number here is an
# assumption the Goals tab prints next to its chart; nothing is a forecast.

withdrawal_rate: 0.04        # FIRE number = expense target / withdrawal rate (Bengen 1994, Trinity study)
fat_multiple: 1.5            # fat FIRE expense target when the user gives no figure: x current expenses
stretch_band: 0.02           # required return within this many points above the available yield -> "stretch"
max_horizon_years: 100       # years_to_target gives up (None) beyond this

# Annual return a *diversified stock/bond portfolio* projection assumes per risk profile (nominal).
# Used for the conventional goal and FIRE projections, never for the options income view.
assumed_return:
  conservative: 0.05
  balanced: 0.06
  aggressive: 0.07

# The highest return a goal may assume under each profile. A required return above the cap makes
# the verdict "does_not_fit" whatever the current screen yields (knowledge/basics/risk_profiles.md).
max_assumed_return:
  conservative: 0.06
  balanced: 0.09
  aggressive: 0.12

# Expected yield of a short put (PRD 3.8, W22): premium less the expected payoff
# E[max(K - S_T, 0)], with S_T lognormal at this drift and at this share of the implied vol.
# Both are printed beside the chart. At a drift equal to the cash rate and a ratio of 1 the
# expected yield is the cash rate: a seller earns only the volatility premium.
expected_drift: 0.06         # stock price drift a year
realised_to_implied: 0.85    # realised volatility as a multiple of implied volatility

retirement_age: 59.5         # IRA balances are treated as unavailable before this age
savings_rate_table:          # illustration on the Goals tab: savings rates x years to independence
  rates: [0.10, 0.20, 0.30, 0.50]
  real_return: 0.05
