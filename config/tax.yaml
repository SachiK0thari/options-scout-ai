# Tax & Accounts agent (Phase 12, docs/capstone-plan.md section 12.4). Mechanics only: the app
# never computes a tax liability or a rate. Sources: knowledge/tax/*.md (IRS Pub 550, section 1256).

long_term_holding_days: 366  # informational: "more than one year" is counted in calendar months, not days (core/tax.py:long_term_threshold, Rev. Rul. 66-7); 366 days is wrong across a leap day
wash_sale_window_days: 30    # 30 days before and 30 days after the loss sale (a 61-day window)
early_withdrawal_age: 59.5   # IRA distributions before this age may owe the additional tax (Tax Topic 557)

# Broad-based index products whose listed options are Section 1256 contracts (60/40, mark-to-market).
section_1256_underlyings: [SPX, XSP, NDX, RUT, DJX, VIX, OEX, XEO]
# Equity-style ETF options in or near this app's universe that are NOT Section 1256 contracts.
equity_option_etfs: [SPY, QQQ, IWM, DIA, VOO, IVV, VTI]
