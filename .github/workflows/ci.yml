name: CI
on:
  push:
  pull_request:
jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - name: Install (pinned by requirements.txt)
        run: make install
      - name: requirements.txt matches pyproject.toml
        run: make requirements-check
      - name: Lint (ruff + mypy --strict)
        run: make lint
      - name: Tests with coverage (fails below 85% on core/, rag/, agent/, bottleneck/)
        run: make test-cov COV_ARGS="--cov-report=xml"
      - name: Committed eval report describes this code (W34; a warning here, enforced weekly)
        continue-on-error: true
        run: make eval-check
      - name: Evals (writes evals/reports/latest.md; fails on any FAIL row)
        run: make eval
      - name: Upload coverage and eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage.xml
            evals/reports/latest.md
            evals/reports/latest.json
