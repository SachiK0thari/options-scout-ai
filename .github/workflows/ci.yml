name: CI
on:
  push:
  pull_request:
jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - name: Install
        run: make install
      - name: Lint (ruff + mypy --strict)
        run: make lint
      - name: Tests with coverage (fails below 85% on core/, rag/, agent/)
        run: make test-cov COV_ARGS="--cov-report=xml"
      - name: Evals (writes evals/reports/latest.md; fails on any FAIL row)
        run: make eval
      - name: Upload coverage and eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage.xml
            evals/reports/latest.md
            evals/reports/latest.json
