[project]
name = "options-scout-ai"
version = "0.1.0"
description = "Multi-agent LangGraph screener for cash-secured puts, LEAPS and PMCCs with a social arbitrage signal. Educational tool, not investment advice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "anthropic==2.3.0",
    "openai==3.40.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sse-starlette==3.6.0",
    "streamlit==1.66.1",
    "plotly==7.1.0",
    "yfinance==1.7.0",
    "praw==8.0.3",
    "feedparser==6.0.14",
    "rapidfuzz==3.14.6",
    "vaderSentiment==3.3.2",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "pyyaml==6.0.3",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "structlog==26.1.0",
    "python-dotenv==1.2.4",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.12",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
    "pre-commit==4.7.0",
    "pandas-stubs==3.0.5.260914",
]

[project.scripts]
options-scout = "options_scout.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/options_scout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "B008", "RUF001", "RUF002", "RUF003", "SIM108", "N803", "N806"]  # N803/N806: S, K, T option notation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806", "N802", "E501"]
"src/options_scout/llm/rules.py" = ["E501"]  # long regexes and narrative templates
"evals/**" = ["E501"]
"ui/**" = ["E501"]
"scripts/**" = ["E501"]
"notebooks/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["options_scout"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*", "yfinance", "yfinance.*", "praw", "praw.*", "feedparser", "vaderSentiment", "vaderSentiment.*", "scipy", "scipy.*", "streamlit", "streamlit.*", "plotly", "plotly.*", "sse_starlette", "sse_starlette.*", "langgraph.checkpoint.sqlite", "langgraph.checkpoint.sqlite.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Non-core packages are typed but not held to --strict (they wrap untyped third-party libs).
module = ["options_scout.api.*", "options_scout.jobs.*"]
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live' --strict-markers"
markers = [
    "live: tests that hit the network (skipped by default; run with `make test-live`)",
    "llm: tests that need an LLM API key",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/options_scout"]
